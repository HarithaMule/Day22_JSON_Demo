<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working with JSON Data</title>
</head>
<body>
    <div id="output"></div>
    <!--create a webpage to read JSON Data-->
    <script>
        const students = [
            {"id":1,"name" : "Amit","course":"Javascript"},
            {"id":2,"name":"Neha","course" : "Python"},
            {"id":3,"name":"Rahul","course":"Data Engineering"}

        ];
    
//here we are adding json.parse to convert json data into object
//above conversion is necessary to access the data in json format
//json.stingify is used to convert object into json format which is done while data is sending to the user
        
        students.forEach(student =>{
            console.log(`ID: ${student.id },Name: ${student.name},Course:${student.course}`);
            //logging each students details to the console
            //we can also use dom manipulation to display on the web page
            //creating html tags dynamically using js code
            const div = document.createElement('div');
            div.innerHTML = `<p>ID:${student.id},Name:${student.name},Course:${student.course}</p>`;
            document.body.appendChild(div);
        });
    let result="";
 document.getElementById("output").innerHTML = result;
    </script>
</body>
</html>
